[package]
name = "substrate-metadata-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { version = "1.0.100" }
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.4.0", features = ["server", "transport-io", "schemars"] }
scale-value = { version = "0.18.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
subxt-metadata = { version = "0.50.3" }
subxt-utils-fetchmetadata = { version = "0.50.3", features = ["url"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

# Versions have to match what subxt-metadata depends on.
frame-decode = { version = "0.18.1", default-features = false }
frame-metadata = { version = "23.0.1" }
scale-decode = { version = "0.16.2", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false }
