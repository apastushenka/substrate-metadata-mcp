[package]
name = "substrate-metadata-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Read-only MCP server that indexes a Substrate runtime's metadata: pallets and runtime APIs. Lists, searches and reads calls, storage, events, errors, constants, view functions and API methods, without touching chain state."
repository = "https://github.com/apastushenka/substrate-metadata-mcp"
license = "MIT OR Apache-2.0"
keywords = ["substrate", "polkadot", "subxt", "mcp", "metadata"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["CLAUDE.md", "/.github"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = { version = "1.0.100" }
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.4.0", features = ["server", "transport-io", "schemars"] }
scale-value = { version = "0.18.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
subxt-metadata = { version = "0.50.3" }
subxt-utils-fetchmetadata = { version = "0.50.3", features = ["url"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs"] }

# Versions have to match what subxt-metadata depends on.
frame-decode = { version = "0.18.1", default-features = false }
frame-metadata = { version = "23.0.1" }
parity-scale-codec = { version = "3.7.5", default-features = false }
scale-decode = { version = "0.16.2", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false }
